<body id="projectPage">

    <!-- Show 'Demotable'. 
        Data will be fetched and inserted here dynamically using JavaScript. -->
        <h2>Show Coupon_Use Table</h2>
        <table id="tableDisplay" border="1">
            <thead> <!-- Table Head -->
                <tr> <!-- Table Row -->
                    <!--Table head, need to be adjusted accordingly to align with your own.-->

        <form id="projectForm">
            <h3>Choose the columns to project:</h3><br>
          
            <label class="option">
              <input type="checkbox" name="attribute" value="couponID">
              couponID
            </label><br>
          
            <label class="option">
              <input type="checkbox" name="attribute" value="discount_amount">
              discount_amount
            </label><br>
          
            <label class="option">
              <input type="checkbox" name="attribute" value="expiry_date">
              expiry_date
            </label><br>
          
            <label class="option">
              <input type="checkbox" name="attribute" value="userID">
              userID
            </label><br>
          
            <label class="option">
              <input type="checkbox" name="attribute" value="license_number">
              license_number
            </label><br><br>
          
            <button type="submit">Project</button>
          </form>
          

    <div id="projectCouponMsg"></div>
