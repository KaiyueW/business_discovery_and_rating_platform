  <table id="havingTable" border="1">

      <tr>
        <th>reviewID</th>
        <th>review_date</th>

        <th>text</th>

    </tbody>

        <br><hr><br> <!-- ========================================================================= -->
    

        <h2> Having </h2>

           <p>Click the button to see users who have written at least 2 reviews.</p>
            <button type="submit"> Having </button> <br>
    
        </form>
        <div id="havingMsg"></div>

    <br><hr><br> <!-- Horizontal Rule (水平线) ========================================================================= -->

    <h2>Show Table applying Having</h2>
  <table id="resultTableDisplay" border="1">
    COUNT(*) indicates the number of reviews written by the user.
    <thead>
      <tr>
        <th>userID</th>
        <th>COUNT(*)</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
